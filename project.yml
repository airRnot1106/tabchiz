name: Tabchiz
options:
  bundleIdPrefix: dev.airrnot
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Tabchiz:
    type: application
    platform: iOS
    sources:
      - Tabchiz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.airrnot.tabchiz
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 現在地の周辺を検索するために使います。
        INFOPLIST_KEY_CFBundleDisplayName: Tabchiz
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  TabchizTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TabchizTests
    dependencies:
      - target: Tabchiz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.airrnot.tabchiz.tests
        GENERATE_INFOPLIST_FILE: "YES"
  TabchizUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TabchizUITests
    dependencies:
      - target: Tabchiz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.airrnot.tabchiz.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Tabchiz:
    build:
      targets:
        Tabchiz: all
        TabchizTests: [test]
        TabchizUITests: [test]
    test:
      targets:
        - TabchizTests
        - TabchizUITests
