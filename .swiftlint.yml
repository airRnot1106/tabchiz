included:
  - Tabchiz
  - TabchizTests
  - TabchizUITests

# swift-format owns layout, so rules that would contradict its output stay off.
disabled_rules:
  - line_length
  - opening_brace
  - trailing_comma

opt_in_rules:
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - yoda_condition
